name: بناء تطبيق أندرويد (APK)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#050A10' --iconBackgroundColorDark '#050A10' --splashBackgroundColor '#060B12' --splashBackgroundColorDark '#060B12'
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk wird.apk
      - uses: actions/upload-artifact@v4
        with: { name: wird-apk, path: wird.apk }
      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: wird.apk }
